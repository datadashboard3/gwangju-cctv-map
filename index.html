<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광주시 CCTV 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 왼쪽 조작·통계 패널 + 오른쪽 전체 지도, 좁은 화면에서는 패널이 아래로 */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1d2430; --muted:#5f6b7a; --line:#e3e7ec; --accent:#2457c5;
  --g-over:#d7301f; --g-7:#f08a3c; --g-next:#e2b100; --g-ok:#2e9e5b; --g-unk:#9aa3ad;
  --font:"Pretendard",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;color:var(--fg);background:var(--bg);display:flex}
#panel{width:340px;flex:none;height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 18px 28px;display:flex;flex-direction:column;gap:16px}
#map{flex:1;height:100%}
h1{font-size:19px;margin:0;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.5}
.sec h2{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:9px 10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.warn b{color:var(--g-over)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
select,input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--fg)}
.row{display:flex;gap:8px}
.legend{display:flex;flex-direction:column;gap:5px}
.legend label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.legend .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tr.sel{background:#e8eefb}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--g-over);vertical-align:middle;margin-left:4px}
.tablewrap{max-height:360px;overflow-y:auto}
.note{font-size:11.5px;color:var(--muted);line-height:1.55}
.pop h3{margin:0 0 4px;font-size:14px}
.pop .tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;color:#fff;margin-bottom:6px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12.5px}
.pop dt{color:var(--muted)}
.pop dd{margin:0}
.pop ul{margin:6px 0 0;padding-left:16px;font-size:12px}
.cl{border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.35);font-size:12px}
.lgbox{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.25);font-size:12px;line-height:1.7;max-width:230px}
.lgbox .dot{display:inline-block;vertical-align:-1px;margin-right:6px}
.gray{filter:grayscale(1) brightness(1.04) contrast(.92)}
button.reset{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:760px){
  body{flex-direction:column-reverse}
  #panel{width:100%;height:46%;border-right:0;border-top:1px solid var(--line)}
  #map{height:54%;flex:none}
}
</style>
</head>
<body>
<aside id="panel">
  <div>
    <h1>경기도 광주시 CCTV 분포</h1>
    <div class="sub" id="asof"></div>
  </div>
  <div class="sec">
    <h2>현재 필터 기준</h2>
    <div class="stats">
      <div class="stat"><b id="sSite">0</b><span>지점</span></div>
      <div class="stat"><b id="sCam">0</b><span>카메라</span></div>
      <div class="stat warn"><b id="sAged">0</b><span>7년 경과 카메라</span></div>
    </div>
  </div>
  <div class="sec">
    <h2>표시 방식</h2>
    <div class="seg" id="viewSeg">
      <button data-v="cluster" aria-pressed="true">묶음</button>
      <button data-v="points" aria-pressed="false">개별 점</button>
      <button data-v="heat" aria-pressed="false">밀집도</button>
    </div>
  </div>
  <div class="sec">
    <h2>색 구분</h2>
    <div class="seg" id="colorSeg">
      <button data-c="g" aria-pressed="true">내구연한</button>
      <button data-c="d" aria-pressed="false">관리부서</button>
      <button data-c="c" aria-pressed="false">구분코드</button>
    </div>
  </div>
  <div class="sec">
    <h2>필터</h2>
    <div style="display:flex;flex-direction:column;gap:8px">
      <select id="fUmd" aria-label="읍면동"></select>
      <input id="fQ" type="search" placeholder="CCTV번호 또는 주소 검색 (예: 초월-A, 도평리)">
      <div class="legend" id="legend"></div>
      <div class="row"><button class="reset" id="reset">필터 초기화</button></div>
    </div>
  </div>
  <div class="sec">
    <h2>읍면동별 (클릭하면 이동)</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th data-s="u">읍면동</th><th data-s="site">지점</th><th data-s="cam">카메라</th><th data-s="rate">7년 경과</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <div class="note">
    · 7년 경과 = 설치 후 7년 이상(2019년 이전 설치). 카메라 사양에 연도가 있으면 그 연도, 없으면 지점 설치일 기준.<br>
    · 지점 색은 그 지점에서 가장 오래된 카메라 기준입니다.<br>
    · 카메라대수가 비어 있는 지점은 카메라 0대로 셉니다.<br>
    · 출처: 공공데이터포털 「경기도 광주시_CCTV 현황(공간정보)」, 좌표 EPSG:5186 → WGS84 변환.
  </div>
</aside>
<div id="map"></div>

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const GRADES = [
  ['8년 이상', css('--g-over')],
  ['7년 도달(' + (DATA.year - 7) + '년 설치)', css('--g-7')],
  [(DATA.year + 1) + '년 도래 예정', css('--g-next')],
  ['내구연한 이내', css('--g-ok')],
  ['연도 미상', css('--g-unk')],
];
const PAL = ['#2457c5','#d7301f','#2e9e5b','#8e44ad','#e67e22','#16a2b8','#b8860b','#c2185b','#5d6d7e','#7cb342'];
const pts = DATA.pts;
document.getElementById('asof').textContent = `자료 기준일 ${DATA.asof} · 내구연한 판정 ${DATA.year}년 기준 · 전체 ${pts.length.toLocaleString()}개 지점`;

function topKeys(key, n){
  const c = {}; pts.forEach(p => c[p[key]] = (c[p[key]]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
const colorSets = {
  g: GRADES.map(g=>g[0]),
  d: topKeys('d'),
  c: topKeys('c').sort(),
};
function colorOf(mode, v){
  if (mode==='g'){ const g = GRADES.find(x=>x[0]===v); return g?g[1]:css('--g-unk'); }
  const i = colorSets[mode].indexOf(v);
  return i>=0 && i<PAL.length ? PAL[i] : '#9aa3ad';
}
function labelOf(mode, v){
  if (mode==='c') return v || '(빈값)';
  return v;
}

const state = { view:'cluster', color:'g', umd:'', q:'', hidden:new Set() };

const map = L.map('map', { preferCanvas:true, zoomControl:true }).setView([37.40, 127.28], 11);
const base = {
  '일반 지도': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}),
  '흑백 지도': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, className:'gray', attribution:'&copy; OpenStreetMap'}),
  '위성 사진': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Esri World Imagery'}),
};
base['흑백 지도'].addTo(map);
L.control.layers(base, null, {position:'topright'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

const legendCtl = L.control({position:'bottomright'});
legendCtl.onAdd = () => { const d = L.DomUtil.create('div','lgbox'); d.id='mapLegend'; return d; };
legendCtl.addTo(map);

let layer = null;
const renderer = L.canvas({padding:.5});

function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(y){ return y && y.length===8 ? `${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6)}` : '미상'; }
function popup(p){
  const col = colorOf('g', p.g);
  return `<div class="pop"><h3>${esc(p.n||'(번호 없음)')}</h3>
  <span class="tag" style="background:${col}">${esc(p.g)}${p.mx!=null?` · 최대 ${p.mx}년 경과`:''}</span>
  <dl><dt>설치위치</dt><dd>${esc(p.l||'-')}</dd><dt>읍면동</dt><dd>${esc(p.u)}</dd>
  <dt>관리부서</dt><dd>${esc(p.d)}</dd><dt>구분코드</dt><dd>${esc(p.c||'-')}</dd>
  <dt>설치일자</dt><dd>${fmtDate(p.y)}</dd><dt>카메라</dt><dd>${p.k}대${p.k?` (7년 경과 ${p.a}대)`:' (대수 미입력)'}</dd></dl>
  ${p.s.length?`<ul>${p.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>`;
}

function filtered(){
  const q = state.q.trim().toLowerCase();
  return pts.filter(p => (!state.umd || p.u===state.umd)
    && !state.hidden.has(state.color+'|'+p[state.color])
    && (!q || (p.n||'').toLowerCase().includes(q) || (p.l||'').toLowerCase().includes(q)));
}

function clusterIcon(cl){
  const ms = cl.getAllChildMarkers();
  let cam=0, aged=0; ms.forEach(m=>{cam+=m.p.k; aged+=m.p.a;});
  const n = ms.length, r = aged/(cam||1);
  const col = state.color==='g' ? (r>=.6?css('--g-over'):r>=.4?css('--g-7'):r>=.2?css('--g-next'):css('--g-ok')) : '#2457c5';
  const s = n<10?30:n<50?36:n<200?44:52;
  return L.divIcon({html:`<div class="cl" style="width:${s}px;height:${s}px;background:${col}">${n}</div>`, className:'', iconSize:[s,s]});
}

function draw(){
  if (layer) { map.removeLayer(layer); layer=null; }
  const list = filtered();
  if (state.view==='heat'){
    layer = L.heatLayer(list.map(p=>[p.la,p.lo, .4 + Math.min(p.k,6)*.1]), {radius:22, blur:18, maxZoom:15}).addTo(map);
  } else {
    const ms = list.map(p => { const m = L.circleMarker([p.la,p.lo], {renderer, radius: state.view==='points'?5:6, weight:1, color:'#ffffff', fillColor: colorOf(state.color, p[state.color]), fillOpacity:.9}); m.p=p; m.bindPopup(()=>popup(p), {maxWidth:320}); return m; });
    if (state.view==='cluster'){ layer = L.markerClusterGroup({iconCreateFunction:clusterIcon, maxClusterRadius:50, showCoverageOnHover:false, chunkedLoading:true}); layer.addLayers(ms); }
    else layer = L.layerGroup(ms);
    layer.addTo(map);
  }
  stats(list); legend(); mapLegend(); table();
}

function stats(list){
  let cam=0, aged=0; list.forEach(p=>{cam+=p.k; aged+=p.a;});
  sSite.textContent = list.length.toLocaleString();
  sCam.textContent = cam.toLocaleString();
  sAged.textContent = aged.toLocaleString() + (cam?` (${Math.round(aged/cam*100)}%)`:'');
}

function legend(){
  const mode = state.color, keys = colorSets[mode];
  const base = pts.filter(p => !state.umd || p.u===state.umd);
  const cnt = {}; base.forEach(p=>cnt[p[mode]]=(cnt[p[mode]]||0)+1);
  const el = document.getElementById('legend'); el.innerHTML='';
  keys.forEach(k => {
    const id = 'lg_'+mode+'_'+keys.indexOf(k);
    const lab = document.createElement('label');
    lab.innerHTML = `<input type="checkbox" id="${id}" ${state.hidden.has(mode+'|'+k)?'':'checked'}><span class="dot" style="background:${colorOf(mode,k)}"></span>${esc(labelOf(mode,k))}<span class="n">${(cnt[k]||0).toLocaleString()}</span>`;
    lab.querySelector('input').addEventListener('change', e => { e.target.checked ? state.hidden.delete(mode+'|'+k) : state.hidden.add(mode+'|'+k); draw(); });
    el.appendChild(lab);
  });
}

function mapLegend(){
  const d = document.getElementById('mapLegend');
  const title = {g:'내구연한 (지점의 가장 오래된 카메라)', d:'관리부서', c:'CCTV 구분코드'}[state.color];
  let h = `<b>${title}</b><br>` + colorSets[state.color].slice(0, state.color==='g'?5:PAL.length).map(k=>`<span class="dot" style="background:${colorOf(state.color,k)}"></span>${esc(labelOf(state.color,k))}`).join('<br>');
  if (state.color!=='g' && colorSets[state.color].length>PAL.length) h += `<br><span class="dot" style="background:#9aa3ad"></span>그 외`;
  if (state.view==='cluster' && state.color==='g') h += `<br><span style="color:#5f6b7a">묶음 색 = 7년 경과 카메라 비율</span>`;
  d.innerHTML = h;
}

let sortKey='rate', sortDir=-1;
function table(){
  const q = state.q.trim().toLowerCase();
  const rows = {};
  pts.filter(p => !state.hidden.has(state.color+'|'+p[state.color]) && (!q || (p.n||'').toLowerCase().includes(q) || (p.l||'').toLowerCase().includes(q)))
     .forEach(p => { const r = rows[p.u] ||= {u:p.u, site:0, cam:0, aged:0, la:0, lo:0}; r.site++; r.cam+=p.k; r.aged+=p.a; r.la+=p.la; r.lo+=p.lo; });
  const arr = Object.values(rows).map(r => ({...r, rate: r.cam? r.aged/r.cam : 0}));
  arr.sort((a,b)=> sortKey==='u' ? a.u.localeCompare(b.u)*-sortDir : (a[sortKey]-b[sortKey])*sortDir);
  tb.innerHTML = arr.map(r => `<tr data-u="${esc(r.u)}" class="${r.u===state.umd?'sel':''}"><td>${esc(r.u)}</td><td>${r.site.toLocaleString()}</td><td>${r.cam.toLocaleString()}</td><td>${Math.round(r.rate*100)}%<span class="bar" style="width:${Math.round(r.rate*36)}px"></span></td></tr>`).join('');
}
document.querySelectorAll('th[data-s]').forEach(th => th.addEventListener('click', () => { const k = th.dataset.s; sortDir = (sortKey===k)? -sortDir : -1; sortKey=k; table(); }));
tb.addEventListener('click', e => { const tr = e.target.closest('tr'); if(!tr) return; const u = tr.dataset.u; setUmd(state.umd===u?'':u); });

function setUmd(u){
  state.umd = u; fUmd.value = u; draw();
  const sel = pts.filter(p=>!u || p.u===u);
  if (sel.length) map.fitBounds(L.latLngBounds(sel.map(p=>[p.la,p.lo])).pad(0.08));
}

const umds = [...new Set(pts.map(p=>p.u))].sort();
fUmd.innerHTML = '<option value="">읍면동 전체</option>' + umds.map(u=>`<option>${esc(u)}</option>`).join('');
fUmd.addEventListener('change', () => setUmd(fUmd.value));
let qt; fQ.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(()=>{ state.q = fQ.value; draw(); }, 200); });
document.getElementById('reset').addEventListener('click', () => { state.hidden.clear(); state.q=''; fQ.value=''; setUmd(''); });
function seg(id, key, attr){
  document.querySelectorAll('#'+id+' button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#'+id+' button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    state[key] = b.dataset[attr]; draw();
  }));
}
seg('viewSeg','view','v'); seg('colorSeg','color','c');
draw();
const ALL = L.latLngBounds(pts.map(p=>[p.la,p.lo])).pad(0.03);
function fitAll(){ map.invalidateSize(); if (!state.umd) map.fitBounds(ALL); }
fitAll();
window.addEventListener('load', () => setTimeout(fitAll, 50));
let fitDone = false;
new ResizeObserver(() => { map.invalidateSize(); if (!fitDone && map.getSize().x > 0) { fitDone = true; fitAll(); } }).observe(document.getElementById('map'));
</script>
